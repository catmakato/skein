# NeoForge 1.20.1 mod metadata. Version fields use ${...} placeholders that the
# build substitutes from gradle.properties so nothing is hardcoded twice.
modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "skein"
version = "${version}"
displayName = "Skein"
description = "Automatic, resumable, hash-verified modpack sync."

[[dependencies.skein]]
    modId = "neoforge"
    mandatory = true
    versionRange = "[47,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.skein]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20.1,1.21)"
    ordering = "NONE"
    side = "BOTH"
